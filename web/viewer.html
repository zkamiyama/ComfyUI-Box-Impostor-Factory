<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Impostor Viewer</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#16191d;color:#f2f2ef}
*{box-sizing:border-box}body{margin:0;display:flex;min-height:100dvh;flex-direction:column}
header,main,footer{padding:12px 18px}header{display:flex;align-items:baseline;flex-wrap:wrap;gap:7px 20px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.025em}#status{font-size:13px;color:#bdcbd1;overflow-wrap:anywhere}
#status.error{color:#ffaf96}main{display:flex;flex-flow:column;flex:1;gap:12px;padding-top:0}
.controls{display:flex;flex-flow:row wrap;align-items:center;gap:8px 14px}label{display:flex;align-items:center;gap:6px}
select,input,button{font:inherit}button,select{border:1px solid #444d50;border-radius:5px;background:#232a2e;color:inherit;padding:5px 9px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #afd9b1;outline-offset:2px}
#stage{position:relative;border:1px solid #444b4d;overflow:hidden;flex:1;min-height:340px;border-radius:7px;background:#42474b}
#canvas{width:100%;height:100%;display:block;position:absolute;inset:0;touch-action:none}
#stage.checker{background:repeating-conic-gradient(#50555a 0 25%,#404449 0 50%) 0/24px 24px}
.labels{position:absolute;inset:0;pointer-events:none;display:none}.labels span{width:50%;padding:10px;color:white;text-shadow:0 1px 4px black}.labels span+span{border-left:1px solid #b6bdc0}
#atlas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#292d31;image-rendering:pixelated}
#stage strong{font-weight:500}footer{font-size:12px;color:#b6c0c3;padding-top:0}
#faceQA{margin:0 18px 12px;color:#d2dbdd}#faceQA summary{width:fit-content;cursor:pointer}
#faceQA table{margin:8px 0;border-collapse:collapse;font-size:13px}#faceQA :is(th,td){padding:3px 12px 3px 0;text-align:left}
#faceQA a{color:#b8d9f0}
[hidden]{display:none!important}@media(max-width:600px){header,main,footer{padding-left:10px;padding-right:10px}#stage{min-height:45dvh}}
</style>
<script type="importmap">
{"imports":{"three":"__BI_BASE__/vendor/three/build/three.webgpu.js","three/webgpu":"__BI_BASE__/vendor/three/build/three.webgpu.js","three/tsl":"__BI_BASE__/vendor/three/build/three.tsl.js","three/addons/":"__BI_BASE__/vendor/three/examples/jsm/","three-impostor":"__BI_BASE__/vendor/three-impostor/Impostor.js"}}
</script>
</head>
<body>
<header><h1>Box Impostor Viewer</h1><span id="status" role="status">読み込み中…</span></header>
<main>
<div class="controls">
<label>表示<select id="mode"><option value="box">Box</option><option value="proxy">元のメッシュ</option><option value="both">左右で比較</option><option value="atlas">アトラス・ガイド</option></select></label>
<label id="appearanceLabel">Boxの色<select id="appearance"><option value="active">採用色</option><option value="base">ベイク時の色</option></select></label>
<label id="samplingLabel">補間<select id="sampling"><option value="standard">標準（穴・細部優先）</option><option value="reduce_bleeding">色にじみ低減（境界優先）</option></select></label>
<label id="shadingLabel">描画<select id="shading"><option value="lit">照明あり</option><option value="albedo">色のみ</option><option value="normal">面の法線（ワールド）</option><option value="depth">ヒット深度（手前が白）</option></select></label>
<label id="mapLabel" hidden>画像<select id="map"></select></label>
<label>視点<select id="view"><option value="diagonal">斜め</option><option>+X</option><option>-X</option><option>+Y</option><option>-Y</option><option>+Z</option><option>-Z</option></select></label>
<label>投影<select id="projection"><option value="perspective">透視</option><option value="orthographic">正投影</option></select></label>
<label>背景<select id="background"><option value="checker">市松</option><option value="#71767a">グレー</option><option value="#111111">黒</option><option value="#ffffff">白</option></select></label>
<label id="lightLabel">照明角度<input type="range" id="light" min="-180" max="180" value="36"></label>
<button id="fit" type="button">全体表示</button>
</div>
<div id="stage" class="checker">
<canvas id="canvas" aria-label="3Dモデル"></canvas><img id="atlas" alt="選択中のテクスチャまたはガイド" hidden>
<div class="labels" id="labels"><span>元のメッシュ</span><span>Box</span></div>
</div>
</main><details id="faceQA" hidden><summary>6面の採否</summary><table>
<thead><tr><th>方向</th><th>表示中の色</th><th>判定理由</th></tr></thead><tbody></tbody>
</table><a hidden>面別の計測結果（JSON）</a></details>
<footer id="help">ドラッグで回転、ホイールでズーム、右ドラッグで移動</footer>
<script type="module" src="./viewer.mjs"></script>
</body></html>
