name: ComfyUI native nodes
on:
  push:
    branches: [main]
    paths: ['box_nodes/**', '__init__.py', 'worker/**', '.github/workflows/comfy-native.yml', 'tests/comfy_smoke.py', 'tests/comfy_frontend_smoke.mjs', 'tests/make_fixture.mjs', 'tests/check_workflow_types.py', 'tests/test_*.py', 'pyproject.toml', 'requirements.txt', 'workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comfy-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BI_SOFTWARE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: c5751c81abe131202eea9e4c66d000589013dd0b
          path: .test-comfy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .test-comfy/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium --only-shell
      - name: Install ComfyUI with CPU PyTorch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          python -m pip install -r .test-comfy/requirements.txt -r requirements.txt
          ln -s "$GITHUB_WORKSPACE" .test-comfy/custom_nodes/box_impostor_factory
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Execute registered nodes and shipped frontend workflows
        run: python tests/comfy_smoke.py --comfy .test-comfy --output .test-output/comfy
      - name: Show ComfyUI log on failure
        if: failure()
        run: tail -150 .test-output/comfy/comfy.log || true
      - name: Save frontend-compiled prompts and execution proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comfy-frontend-workflows
          path: .test-output/comfy/frontend/
          if-no-files-found: ignore
          retention-days: 7
