name: Box roundtrip
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer:
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl2, webgpu]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BI_SOFTWARE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tests/make_fixture.mjs .test-output/source.glb
      - name: Bake and reload in a new Chromium process
        run: node worker/cli.mjs bake --input .test-output/source.glb --output .test-output/box --backend ${{ matrix.backend }} --resolution 128 --maps roughness,metalness,ao --verify --evidence .test-output/evidence
      - name: Verify the low-resolution texture restore
        run: node worker/cli.mjs bake --input .test-output/source.glb --output .test-output/box32 --backend ${{ matrix.backend }} --resolution 32 --maps roughness,metalness,ao --verify --evidence .test-output/evidence32
      - name: Compare mesh and Box in the viewer
        run: BI_TEST_ASSET=.test-output/box BI_TEST_BACKEND=${{ matrix.backend }} node --test tests/viewer_integration.test.mjs
      - name: Render final Box IMAGE with optional anti-bleeding
        run: |
          node worker/cli.mjs render --asset .test-output/box --output .test-output/standard.png --backend ${{ matrix.backend }} --view diagonal --projection orthographic --width 320 --height 256 --sampling standard
          node worker/cli.mjs render --asset .test-output/box --output .test-output/reduced.png --backend ${{ matrix.backend }} --view diagonal --projection orthographic --width 320 --height 256 --sampling reduce_bleeding
          node tests/check_render.mjs .test-output/standard.png .test-output/reduced.png 320 256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-roundtrip-${{ matrix.backend }}
          path: .test-output/
          if-no-files-found: ignore
