name: Box roundtrip
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer:
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl2, webgpu]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BI_SOFTWARE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tests/make_fixture.mjs .test-output/source.glb
      - name: Bake and reload in a new Chromium process
        run: node worker/cli.mjs bake --input .test-output/source.glb --output .test-output/box --backend ${{ matrix.backend }} --resolution 128 --maps roughness,metalness,ao --verify --evidence .test-output/evidence
      - name: Verify the low-resolution texture restore
        run: node worker/cli.mjs bake --input .test-output/source.glb --output .test-output/box32 --backend ${{ matrix.backend }} --resolution 32 --maps roughness,metalness,ao --verify --evidence .test-output/evidence32
      - name: Compare mesh and Box in the viewer
        run: BI_TEST_ASSET=.test-output/box BI_TEST_BACKEND=${{ matrix.backend }} node --test tests/viewer_integration.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the lossless ZIP on all 18 cameras
        run: |
          python -m pip install -r requirements.txt
          python -m box_nodes.archive pack .test-output/box .test-output/sample.box.zip
          python -m box_nodes.archive unpack .test-output/sample.box.zip .test-output/unpacked
          node tests/compare_archive.mjs .test-output/box .test-output/unpacked ${{ matrix.backend }} > .test-output/evidence/archive-roundtrip.json
      - name: Check embedded UV texture, cutout holes and guide depth
        run: |
          node tests/make_textured_fixture.mjs .test-output/textured.glb
          node worker/cli.mjs bake --input .test-output/textured.glb --output .test-output/textured --resolution 128 --backend ${{ matrix.backend }} --verify
          python tests/check_textured_bake.py .test-output/textured ${{ matrix.backend }}
      - name: Render final Box IMAGE with optional anti-bleeding
        run: |
          node worker/cli.mjs render --asset .test-output/box --output .test-output/standard.png --backend ${{ matrix.backend }} --view diagonal --projection orthographic --width 320 --height 256 --sampling standard
          node worker/cli.mjs render --asset .test-output/box --output .test-output/reduced.png --backend ${{ matrix.backend }} --view diagonal --projection orthographic --width 320 --height 256 --sampling reduce_bleeding
          node tests/check_render.mjs .test-output/standard.png .test-output/reduced.png 320 256
      - name: Fit the whole Box at the narrowest supported aspect
        run: |
          for projection in orthographic perspective; do
            node worker/cli.mjs render --asset .test-output/box --output .test-output/portrait-$projection.png --backend ${{ matrix.backend }} --view +Z --projection "$projection" --width 64 --height 2048
          done
          python - <<'PY'
          from PIL import Image
          for projection in ('orthographic','perspective'):
              with Image.open(f'.test-output/portrait-{projection}.png') as image:
                  assert image.size == (64, 2048)
                  left, top, right, bottom = image.getchannel('A').getbbox()
                  assert 0 < left < right < 64 and 0 < top < bottom < 2048
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-roundtrip-${{ matrix.backend }}
          path: .test-output/
          if-no-files-found: ignore
